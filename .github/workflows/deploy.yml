name: Deploy ShittuStores to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production site
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Create SPA route entry points for /mist-fan, /thank-you, /admin, /admin-app, and 404 fallback
        run: |
          mkdir -p dist/mist-fan dist/mist-fan/thank-you dist/thank-you dist/admin dist/admin-app
          cp dist/index.html dist/mist-fan/index.html
          cp dist/index.html dist/mist-fan/thank-you/index.html
          cp dist/index.html dist/thank-you/index.html
          cp dist/index.html dist/admin/index.html
          cp dist/index.html dist/admin-app/index.html
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
